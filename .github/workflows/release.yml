name: Release

# Legt automatisch ein GitHub-Release an, sobald CARD_VERSION in
# temperature-bars-card.js erhöht und nach main gepusht wurde.
# HACS zeigt dadurch die neue Version als Update an.

on:
  push:
    branches: [main]
    paths:
      - temperature-bars-card.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version aus der Karte lesen
        id: version
        run: |
          VERSION=$(grep -oP 'CARD_VERSION = "\K[0-9]+\.[0-9]+\.[0-9]+(?=")' temperature-bars-card.js || true)
          if [ -z "$VERSION" ]; then
            echo "CARD_VERSION (x.y.z) in temperature-bars-card.js nicht gefunden" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Release anlegen, falls es noch keins gibt
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION existiert bereits, nichts zu tun."
          else
            gh release create "v$VERSION" \
              --target "$GITHUB_SHA" \
              --title "v$VERSION" \
              --generate-notes
          fi
